{% extends 'base.html' %}
{% block content %}
<div class="pagehead"><h2>✏️ Edit Shop Details</h2><a class="btn secondary back-btn" href="{{ url_for('profile') }}">← Back</a></div>

<form class="formbox" method="post" enctype="multipart/form-data">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Shop Name</label><input name="shop_name" value="{{ profile['shop_name'] }}" required>
  <label>Contact *</label><input name="contact" value="{{ profile['contact'] }}" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" required>
  <label>Address</label><textarea name="address" placeholder="Address">{{ profile['address'] }}</textarea>

  <label>Shop Logo</label>
  <input id="logo-input" class="file-input-hidden" type="file" name="logo" accept="image/png,image/jpeg,image/webp" onchange="previewLogo(this)">
  <label class="file-picker" for="logo-input">🖼️ Choose Image</label>
  <div id="logo-name" class="file-name">{% if profile['logo'] %}{{ profile['logo'] }}{% else %}No Logo{% endif %}</div>

  <div class="logo-preview" id="logo-preview-box">
    {% if profile['logo'] %}
      <img id="logo-preview" src="{{ url_for('uploads',name=profile['logo']) }}" alt="Shop Logo">
    {% else %}
      <span id="logo-empty">Select an image to see the preview.</span>
      <img id="logo-preview" alt="Shop Logo" style="display:none">
    {% endif %}
  </div>

  <div class="inline form-actions">
    <button class="btn primary" type="submit">💾 Save Changes</button>
    <a class="btn secondary back-btn" href="{{ url_for('profile') }}">← Back</a>
  </div>
</form>
{% endblock %}
